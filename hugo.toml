baseURL = "https://alishabarretto-website.vercel.app/"
languageCode = "en-us"
title = "Alisha Barretto"
theme = "PaperMod"

[params]
  env = 'production'
  title = 'Alisha Barretto'
  description = 'Personal website and portfolio'
  author = 'Alisha Barretto'
  disableScrollToTop = false
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"

  [[params.socialIcons]]
    name = "substack"
    url = "https://substack.com/@alishabarretto"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/alisha_barretto"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/alishabarretto.bsky.social"

  [[params.socialIcons]]
    name = "medium"
    url = "https://alishabarretto.medium.com"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:your-email@example.com"

[params.profileMode]
  enabled = true
  title = 'Alisha Barretto'
  subtitle = 'Welcome to my website'

[[menu.main]]
  identifier = 'essays'
  name = 'Essays'
  url = '/essays/'
  weight = 10
