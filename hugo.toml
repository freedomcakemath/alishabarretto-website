baseURL = 'https://alishabarretto-website.vercel.app/'
languageCode = 'en-us'
title = 'Alisha Barretto'
theme = 'PaperMod'

[params]
  env = 'production'
  title = 'Alisha Barretto'
  description = 'Personal website and portfolio'
  author = 'Alisha Barretto'
  disableScrollToTop = false
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.profileMode]
  enabled = true
  title = 'Alisha Barretto'
  subtitle = 'Welcome to my website'

[menu]
  [[menu.main]]
    identifier = 'essays'
    name = 'Essays'
    url = '/essays/'
    weight = 10

[params.socialIcons]
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/alishabarretto"
  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/alishabarretto"
