baseURL = "https://alishabarretto-website.vercel.app/"
locale = "en-us"
title = "Alisha Barretto"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[params]
  env = 'production'
  title = 'Alisha Barretto'
  description = 'Writing on decentralized systems, human coordination, and building software that respects agency.'
  author = 'Alisha Barretto'
  images = ["/cover.png"]
  
  # Base Theme Parameters
  defaultTheme = "light"
  disableThemeToggle = false
  disableScrollToTop = false

  # Post Layout UI
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowFullTextInRSS = false
  ShowToc = true

  [[params.socialIcons]]
    name = "substack"
    url = "https://substack.com/@alishabarretto"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/alisha_barretto"

  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/alishabarretto.bsky.social"

  [[params.socialIcons]]
    name = "medium"
    url = "https://alishabarretto.medium.com"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:alishabarretto@protonmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.profileMode]
    enabled = true
    title = 'Alisha Barretto'
    subtitle = 'Writing on decentralized systems, human coordination, and building software that respects agency.'
    imageUrl = '/images/profile.webp'
    imageWidth = 150
    imageHeight = 150
    imageTitle = 'Alisha Barretto'

[[menu.main]]
  identifier = 'essays'
  name = 'Essays'
  url = '/essays/'
  weight = 10

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.twitter]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true
    privacyEnhanced = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
