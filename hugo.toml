baseURL = 'https://alishabarretto.statichost.page/'
locale = 'en-us'
title = 'Alisha Barretto'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false   # drafts stay off the live site
buildFuture = true
disableKinds = ["taxonomy", "term"]   # no empty /tags/ or /categories/ pages

# Social icons
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/alisha_barretto"
  [[params.socialIcons]]
    name = "substack"
    url = "https://alishabarretto.substack.com"
  [[params.socialIcons]]
    name = "medium"
    url = "https://medium.com/@alishabarretto"
  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/alishabarretto.bsky.social"
  [[params.socialIcons]]
    name = "mastodon"
    url = "https://mastodon.social/@alishabarretto"

# Header Navigation Menu
[[menu.main]]
  identifier = "essays"
  name = "Essays"
  url = "/essays/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "Past work"
  url = "/archives/"
  weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  # SEO: the homepage <title> and the default meta description
  homeTitle = "Alisha Barretto: FlowPlanned, LoRaWAN projects and essays"
  description = "I build FlowPlanned, a planner that runs entirely on your computer, plus LoRaWAN and solar projects. Before that I ran a skincare brand from my kitchen."
  images = ["images/og-profile.jpg"]
  env = "production"
  ShowSocials = true
  defaultTheme = "auto"        # follows the visitor's OS setting until they use the toggle
  disableThemeToggle = false

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]

# Structured data: tells search engines this site is a person, and which profiles are theirs
# Site-wide footer link
[params.footer]
  text = "[Accessibility](/accessibility/) · [Privacy](/privacy/)"

[params.schema]
  publisherType = "Person"
  sameAs = [
    "https://x.com/alisha_barretto",
    "https://alishabarretto.substack.com",
    "https://medium.com/@alishabarretto",
    "https://bsky.app/profile/alishabarretto.bsky.social",
    "https://mastodon.social/@alishabarretto",
  ]

# Favicons (?v=2 makes browsers fetch the new face icon)
[params.assets]
  favicon = "/favicon.ico?v=2"
  favicon16x16 = "/favicon-16x16.png?v=2"
  favicon32x32 = "/favicon-32x32.png?v=2"
  apple_touch_icon = "/apple-touch-icon.png?v=2"

# Search engine ownership verification (a meta tag only; no analytics or tracking)
[params.analytics.google]
  SiteVerificationTag = "J0t2hXy356b9YkgcKYlxjA6M_jW0u7dBng5Sap4nTas"
