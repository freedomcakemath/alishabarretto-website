baseURL = '/'
locale = 'en-us'
title = 'Alisha Barretto'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = true
buildFuture = true

[params]
  env = 'production'
  ShowSocials = true

  # Restored Social Icons
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/alisha_barretto"
  [[params.socialIcons]]
    name = "substack"
    url = "https://alishabarretto.substack.com"
  [[params.socialIcons]]
    name = "medium"
    url = "https://medium.com/@alishabarretto"
  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/alishabarretto.bsky.social"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:alishabarretto@protonmail.com"

# Header Navigation Menu
[[menu.main]]
  identifier = "essays"
  name = "Essays"
  url = "/essays/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  defaultTheme = "light"
  disableThemeToggle = true
