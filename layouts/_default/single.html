{{ define "main" }}
<!-- Accessible Skip to Content Link -->
<a href="#main-content" class="skip-link">[ SKIP TO MAIN CONTENT ]</a>

<article class="post-single page-wrap" id="main-content">
  <div class="dialog-box" style="margin-top: 1rem;">
    <div class="dialog-header">
      <span>{{ .Title | upper }}.DOC</span>
      <a href="/" style="color: #efe0ad; text-decoration: none;">[X] CLOSE</a>
    </div>
    
    <div class="dialog-body" style="font-family: monospace; line-height: 1.7;">
      <header class="post-header" style="margin-bottom: 1.5rem; border-bottom: 1px dashed #2b2927; padding-bottom: 0.8rem;">
        <h1 class="post-title" style="font-size: 1.4rem; margin-bottom: 0.3rem; color: #1a1918;">{{ .Title }}</h1>
        {{ if .Date }}
        <div class="post-meta" style="font-size: 0.78rem; color: #5c5854;">
          [ DATE: {{ .Date.Format "2006-01-02" }} ]
        </div>
        {{ end }}
      </header>

      <div class="post-content" style="color: #1a1918;">
        {{ .Content }}
      </div>
      
      <div style="margin-top: 2rem; border-top: 1px dashed #2b2927; padding-top: 1rem;">
        <a href="/" class="dialog-btn">[ &lt;- BACK TO INDEX ]</a>
      </div>
    </div>
  </div>
</article>
{{ end }}
