{{- /* Include PaperMod default head structure */ -}}
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-no">
{{- if .Hugo.IsProduction }}
<meta name="robots" content="index, follow">
{{- else }}
<meta name="robots" content="noindex, nofollow">
{{- end }}

<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>

{{- /* Force Light Mode by default unless user toggled */ -}}
<script>
    if (localStorage.getItem("pref-theme") === "dark") {
        document.body.classList.add('dark');
    } else if (localStorage.getItem("pref-theme") === "light") {
        document.body.classList.remove('dark');
    } else {
        document.body.classList.remove('dark');
    }
</script>

<style>
    /* Light Mode Default Styles */
    body {
        background-color: #ffffff !important;
        color: #212529 !important;
    }
    body *, body .profile, body .profile_inner {
        color: inherit;
    }

    /* Dark Mode Enforced High-Contrast Styles */
    body.dark {
        background-color: #1d1e20 !important;
        color: #f8f9fa !important;
    }
    body.dark *, 
    body.dark .post-title, 
    body.dark .post-content, 
    body.dark .profile, 
    body.dark .profile_inner,
    body.dark .first-entry,
    body.dark .entry-header,
    body.dark .entry-content {
        color: #f8f9fa !important;
    }
    body.dark a {
        color: #8ab4f8 !important;
    }
</style>
