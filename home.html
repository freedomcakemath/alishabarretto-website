{{ define "main" }}
<div class="dialog-box home-container" role="main">
  <!-- Window Header -->
  <header class="dialog-header">
    <div class="photo-titlebar">
      <span class="title-text">{{ .Site.Title }} // Desktop Environment</span>
    </div>
  </header>

  <!-- Window Body / Main Content -->
  <section class="dialog-body">
    <div class="dialog-body-text">
      {{ .Content }}
    </div>

    <!-- Quick Directory / Navigation Index -->
    <nav class="dir-index" aria-label="Home Directory Shortcuts">
      <h3>System Directories</h3>
      <ul>
        <li><a href="/about/">[About_Me.txt]</a></li>
        <li><a href="/posts/">[Projects_Log/]</a></li>
        <li><a href="/guestbook/">[Guestbook.log]</a></li>
      </ul>
    </nav>
  </section>

  <!-- Window Footer / Status Bar -->
  <footer class="photo-statusbar">
    <span class="status-left">OS: Win95-Hugo Edition</span>
    <span class="status-right">Ready</span>
  </footer>
</div>

<!-- Simulated Retro Taskbar -->
<nav class="win95-taskbar" aria-label="System Navigation">
  <button class="dialog-btn start-trigger" aria-haspopup="true">Start</button>
  <div class="win95-start-menu">
    <ul>
      <li><a href="{{ .Site.BaseURL }}">Main Desktop</a></li>
      <li><a href="#compliance">Compliance Info</a></li>
    </ul>
  </div>
</nav>
{{ end }}
